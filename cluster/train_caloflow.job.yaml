# Phase 1 CaloFlow training job for NRP/Nautilus (cms-ml namespace).
#
# Pattern: public NVIDIA PyTorch base image + git-clone + pip-install + run upstream
# caloflow/run.py. No custom image needed.
#
# Before applying:
#   1. Push this repo to a public GitHub repo and update REPO_URL below.
#   2. Confirm dataset has been downloaded to /data/raunav/caloflow_ad/data/ad_504/
#      on the caloflow-ad-vol PVC (run cluster/download_data.job.yaml first).
#   3. Verify GPU availability and PVC space:
#        kubectl get nodes -l nvidia.com/gpu.product
#        kubectl exec <some-raunav-pod> -- df -h /data
#
# Per the safety memory: hand the kubectl command back to the user for explicit
# approval before applying.

apiVersion: batch/v1
kind: Job
metadata:
  name: raunav-caloflow-train-seed001
  namespace: cms-ml
  labels:
    user: raunav
    project: caloflow_ad
    phase: "1"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        user: raunav
        project: caloflow_ad
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          # Pinned to nvcr 23.10 (torch 2.1.0a) instead of 24.01 (torch 2.2.0a).
          # Torch 2.2 added strict _group_tensors_by_device_and_dtype check in
          # Adam.step(), which trips on nflows submodule buffers that don't all
          # migrate via .to(device). 2.1 was the era of the AD paper and works.
          image: nvcr.io/nvidia/pytorch:23.10-py3
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              echo "[setup] node=$(hostname)  gpu=$(nvidia-smi -L)  date=$(date -u)"

              # --- code ---
              REPO_URL="${REPO_URL:-https://github.com/raunavm/caloflow_ad.git}"
              REPO_REF="${REPO_REF:-main}"
              git clone --depth=1 --branch "$REPO_REF" "$REPO_URL" code
              cd code

              # --- upstream training repo (caloflow), partial-clone to skip bundled HDFs ---
              git clone --filter=blob:limit=1m --depth=1 \
                https://gitlab.com/claudius-krause/caloflow.git external/caloflow

              # --- minimal deps on top of nvcr pytorch image ---
              # NVIDIA image has torch, numpy, pandas, matplotlib, tensorboard.
              # Missing for caloflow/run.py: nflows and h5py.
              pip install --no-cache-dir nflows==0.14 h5py

              # --- patch caloflow's global float64 default ---
              # caloflow/run.py line 39 does `torch.set_default_dtype(torch.float64)`,
              # which makes every model parameter float64. On L4/L40/A40 GPUs fp64
              # is 30-60x slower than fp32, turning a ~6-10h run into days. The AD
              # paper's hardware (likely A100, fp64 only 2x slower) made this OK.
              # We switch to float32 for the first reproduction; CLAUDE.md's 15-20%
              # tolerance handles any small numerical drift this introduces.
              sed -i 's/torch\.set_default_dtype(torch\.float64)/torch.set_default_dtype(torch.float32)/' external/caloflow/run.py
              sed -i 's/dtype=torch\.float64/dtype=torch.float32/g' external/caloflow/run.py
              echo "[patch] caloflow/run.py default dtype: float64 -> float32"
              grep -n "set_default_dtype\|dtype=torch.float" external/caloflow/run.py | head -5

              # --- patch nflows 0.14 _log_z dtype bug (kept for safety) ---
              # nflows registers StandardNormal._log_z as float64; we want float32.
              NFLOWS_NORMAL=$(python3 -c 'import nflows.distributions.normal as n; print(n.__file__)')
              sed -i 's/dtype=torch.float64/dtype=torch.float32/' "$NFLOWS_NORMAL"
              echo "[patch] $NFLOWS_NORMAL"

              # --- patch caloflow/data.py float64 propagation ---
              # HDF5 datasets are float64. caloflow's loader keeps them as float64
              # numpy arrays, the DataLoader produces float64 tensors, the float32
              # model upcasts the loss to float64, and torch>=2.0 Adam rejects the
              # resulting float64-grads-vs-float32-params mismatch.
              # Two changes:
              #   (1) self.file_X = (... / 1eY).astype('float32')   at load time
              #   (2) add_noise's np.random.rand noise is cast to input dtype so it
              #       doesn't silently upcast a float32 array back to float64.
              python3 <<'PY'
              import re
              p = "external/caloflow/data.py"
              with open(p) as f: src = f.read()

              # (1) cast HDF5 arrays to float32 at load
              src = re.sub(
                  r"(self\.file_(?:layer_\d|energy|overflow))\s*=\s*(self\.full_file\['[^']+'\]\[:\][^\n]+)",
                  r"\1 = (\2).astype('float32')",
                  src,
              )

              # (2) add_noise preserves dtype
              src = src.replace(
                  "def add_noise(input_tensor):\n    noise = np.random.rand(*input_tensor.shape)*1e-8\n    return input_tensor+noise",
                  "def add_noise(input_tensor):\n    noise = (np.random.rand(*input_tensor.shape)*1e-8).astype(input_tensor.dtype)\n    return input_tensor+noise",
              )

              with open(p, "w") as f: f.write(src)
              print("[patch] external/caloflow/data.py")
              PY

              echo "--- patched lines in data.py ---"
              grep -nE "astype\('float32'\)|noise =.*astype" external/caloflow/data.py | head -10

              # --- sanity ---
              python -c "import torch, nflows; print('torch', torch.__version__, 'cuda', torch.cuda.is_available(), 'nflows ok')"
              df -h /data

              # --- run training (upstream caloflow run.py) ---
              # gamma_1.hdf5 for training (70k/30k internal train/val per AD paper).
              # NO --student_mode (we need likelihoods, not IAF fast-gen).
              # caloflow's save_rec_flow / save_flow use torch.save which does NOT
              # auto-create parent dirs, so pre-create the checkpoint subdirs here.
              mkdir -p /data/raunav/caloflow_ad/results/seed_001/saved_checkpoints/Flow_I
              mkdir -p /data/raunav/caloflow_ad/results/seed_001/saved_checkpoints/Flow_II
              cd external/caloflow
              python run.py -p=gamma \
                --train \
                --data_dir=/data/raunav/caloflow_ad/data/ad_504/ \
                --output_dir=/data/raunav/caloflow_ad/results/seed_001/

              echo "[done] $(date -u)"
          env:
            - name: REPO_URL
              value: "https://github.com/raunavm/caloflow_ad.git"  # TODO: fill in
            - name: REPO_REF
              value: "main"
            - name: PYTHONUNBUFFERED
              value: "1"
            # Removed: NVIDIA_VISIBLE_DEVICES=all (was overriding Kubernetes GPU
            # isolation and exposing all GPUs on the node). Kubernetes assigns
            # the single requested GPU automatically.
          resources:
            # Namespace policy requires limit/request ratio <= 1.2
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: project-pvc
              mountPath: /data
      volumes:
        - name: project-pvc
          persistentVolumeClaim:
            claimName: caloflow-ad-vol
      # bf16-capable GPU families per the safety memory
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A100-SXM4-80GB
                      - NVIDIA-A100-SXM4-40GB
                      - NVIDIA-A100-PCIE-40GB
                      - NVIDIA-A40
                      - NVIDIA-RTX-A6000
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - NVIDIA-L4
