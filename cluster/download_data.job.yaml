# One-shot job to download the Zenodo 10393540 dataset onto the calochallenge-vol PVC.
# Run this once before train_caloflow.job.yaml.
#
# Per the safety memory:
#   - Writes only to /data/raunav/calochallenge/data/ad_504/
#   - Will refuse if PVC is >85% full (check beforehand)
#   - Hand the kubectl command to the user for explicit approval before applying.

apiVersion: batch/v1
kind: Job
metadata:
  name: raunav-caloflow-ad-download
  namespace: cms-ml
  labels:
    user: raunav
    project: caloflow_ad
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        user: raunav
        project: caloflow_ad
    spec:
      restartPolicy: Never
      containers:
        - name: downloader
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              DATA_DIR=/data/raunav/caloflow_ad/data/ad_504
              mkdir -p "$DATA_DIR"
              cd "$DATA_DIR"

              # PVC capacity check
              echo "[pvc] $(df -h /data | tail -1)"

              fetch() {
                f="$1"
                if [ -s "$f" ]; then
                  echo "[skip] $f exists ($(du -h "$f" | cut -f1))"
                  return
                fi
                echo "[fetch] $f"
                curl -L --fail --retry 3 -C - -o "$f" "https://zenodo.org/records/10393540/files/$f"
              }

              fetch gamma_1.hdf5
              fetch gamma_2.hdf5
              # Add files_fixed_disp.zip later when needed for signal evaluation:
              # fetch files_fixed_disp.zip

              echo "[done] $(ls -lh)"
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: project-pvc
              mountPath: /data
      volumes:
        - name: project-pvc
          persistentVolumeClaim:
            claimName: calochallenge-vol
